name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        # Excluded rules, reviewed 2026-09-07 against the whole tree:
        # G115 flags every uint/int conversion; ours carry XDR/DB values whose
        # bounds the surrounding code already enforces, and a per-site review
        # belongs to a dedicated PR, not this gate. G704 flags the healthcheck
        # subcommand probing its own local /health (URL from own config, not
        # user input). G104 flags writing the embedded UI index page, where
        # the error has no receiver.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104,G115,G704 ./...
