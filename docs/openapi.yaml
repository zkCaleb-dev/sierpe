openapi: 3.0.3
info:
  title: Sierpe API
  description: |
    Self-hosted Stellar contract indexer. The events surface is a compatible
    superset of the proposed getEvents v2 RPC semantics (stellar#1872):
    positional topic filters, opaque cursors that encode the entire query,
    and scan-status honesty. Coverage is declared in every events response —
    an empty page always says whether it means "nothing happened" or "not
    indexed yet".
  version: 0.1.0-m1
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080

tags:
  - name: public
    description: Read API, no authentication.
  - name: admin
    description: Mutations, authenticated with the ADMIN_TOKEN bearer.
  - name: operational
    description: Health and observability.

paths:
  /v1/contracts:
    post:
      tags: [admin]
      summary: Register a contract (or reconcile an existing registration)
      description: |
        Idempotent. Classifies the contract from its on-chain spec, anchors
        a descending backfill at the current cursor, and starts following it
        live. Re-registering reconciles kinds; a deeper `from` reopens a
        finished backfill; progress is never reset.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id]
              additionalProperties: false
              properties:
                contract_id:
                  type: string
                  description: C... strkey contract address.
                kinds:
                  type: array
                  items:
                    type: string
                    enum: [events, state, transfers, trustlines, movements]
                  description: >
                    Data kinds to derive. Defaults to the classified set:
                    [events, state] for wasm contracts, plus transfers for
                    SACs. Adding a kind to an existing registration reopens
                    the history walk, because a finished walk never derived
                    it (see the coverage schema).
                from:
                  description: >
                    Backfill origin: the string "genesis" (default) or a
                    positive ledger number. Clamped at the retention wall
                    with one persisted gap when sources cannot reach it.
                  oneOf:
                    - type: string
                      enum: [genesis]
                    - type: integer
                      minimum: 1
      responses:
        "200":
          description: The stored registration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The contract does not exist on this network.
        "502":
          description: The chain could not be read to classify; retry later.

    get:
      tags: [public]
      summary: List registered contracts
      description: |
        Every registration on this instance with its classification and
        kinds; lightweight (no per-contract aggregation — fetch the detail
        endpoint for coverage and counts). Ordered by registration time.
      responses:
        "200":
          description: The registration list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractList" }

  /v1/contracts/{id}:
    delete:
      tags: [admin]
      summary: Unregister a contract
      description: |
        Idempotent. Stops following and backfilling. Indexed events are
        kept: a later re-registration resumes instead of restarting.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/contractID" }]
      responses:
        "204": { description: Unregistered (or was never registered). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [public]
      summary: Contract registration, classification, coverage and counts
      parameters: [{ $ref: "#/components/parameters/contractID" }]
      responses:
        "200":
          description: Contract detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/events:
    get:
      tags: [public]
      summary: Query a contract's events (getEvents v2 compatible semantics)
      description: |
        Events in chain order (ascending id). Filters follow getEvents v2:
        `topic0..topic3` match base64 ScVal values exactly, omitted
        positions are wildcards, all present filters AND together.
        Pagination is an opaque `cursor` that encodes the entire query;
        cursors never expire and always honor the bounds they were minted
        with. A cursor cannot be combined with filter or bound parameters.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: topic0
          in: query
          schema: { type: string }
          description: Exact base64 ScVal for topic position 0.
        - name: topic1
          in: query
          schema: { type: string }
        - name: topic2
          in: query
          schema: { type: string }
        - name: topic3
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [contract] }
          description: M1 indexes contract events only.
        - name: startLedger
          in: query
          schema: { type: integer, minimum: 1 }
          description: Inclusive lower bound. Default 1.
        - name: endLedger
          in: query
          schema: { type: integer, minimum: 1 }
          description: Inclusive upper bound. Default unbounded (follow the tip).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque page cursor from a previous response.
      responses:
        "200":
          description: One page of events with scan status and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/state:
    get:
      tags: [public]
      summary: Current contract storage snapshot
      description: |
        Live contract-data entries in (key, durability) order; removed
        entries never appear. The snapshot converges from live ingestion and
        backfill; coverage declares how much history backs it. Pagination is
        an opaque cursor bound to this endpoint.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: key
          in: query
          schema: { type: string }
          description: Exact base64 ScVal entry key.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of live entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateSnapshotPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/state/history:
    get:
      tags: [public]
      summary: Contract storage change history
      description: |
        Every entry change in chain order with provenance and before/after
        values. Same pagination and honesty contract as the events endpoint:
        opaque full-query cursors, scanStatus, declared coverage.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: key
          in: query
          schema: { type: string }
          description: Exact base64 ScVal entry key.
        - name: startLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: endLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of changes with scan status and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateHistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/transfers:
    get:
      tags: [public]
      summary: Decoded token movements
      description: |
        SEP-41 token movements (transfer, mint, burn, clawback) decoded from
        the contract's events, in chain order. Rows share their id with the
        raw event they derive from. Amounts are exact i128 strings in raw
        token units; never sum amounts across contracts. Requires the
        transfers kind on the registration (SACs derive it by default).
        Same pagination and honesty contract as the events endpoint: opaque
        full-query cursors, scanStatus, declared coverage.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: account
          in: query
          schema: { type: string }
          description: Matches either side of the movement; exclusive with from/to.
        - name: from
          in: query
          schema: { type: string }
          description: Exact sender address (G/C/M... strkey as emitted).
        - name: to
          in: query
          schema: { type: string }
          description: Exact recipient address.
        - name: type
          in: query
          schema: { type: string, enum: [transfer, mint, burn, clawback] }
        - name: startLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: endLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of movements with scan status and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransfersPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/trustlines:
    get:
      tags: [public]
      summary: Current trustline holders of the SAC asset
      description: |
        Live classic trustlines of the asset this SAC wraps, in account
        order; removed trustlines never appear. Requires the trustlines
        kind on the registration (opt-in — volume follows the asset's
        classic activity). Native XLM has no trustlines. Balances and
        limits are int64 stroop-scale strings.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: account
          in: query
          schema: { type: string }
          description: Exact holder account (G... strkey).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of live trustlines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustlineSnapshotPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/trustlines/history:
    get:
      tags: [public]
      summary: Trustline change history of the SAC asset
      description: |
        Every trustline change of the wrapped asset in chain order with
        provenance and before/after balances. Same pagination and honesty
        contract as the events endpoint: opaque full-query cursors,
        scanStatus, declared coverage.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: account
          in: query
          schema: { type: string }
          description: Exact holder account (G... strkey).
        - name: startLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: endLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of changes with scan status and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustlineHistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contracts/{id}/movements:
    get:
      tags: [public]
      summary: Token movements this contract took part in
      description: |
        Token transfers naming this contract as sender or recipient,
        whichever contract emitted them. This is the resource that answers
        "what came into and went out of my contract": a payment to a
        contract is emitted by the ASSET's SAC, so it appears here without
        the operator having to register that asset. Requires the
        `movements` kind on the registration.

        Not a balance. Value can also arrive without any SEP-41 transfer
        event (custom tokens, contracts crediting internal balances), and
        amounts are raw base units of different tokens — never sum across
        `tokenContractId`.
      parameters:
        - { $ref: "#/components/parameters/contractID" }
        - name: role
          in: query
          schema: { type: string, enum: [recipient, sender] }
          description: Omit for both directions.
        - name: token
          in: query
          schema: { type: string }
          description: >
            Emitting token contract (C... strkey). The asset's identity is
            its contract, never its SEP-0011 string, which is
            attacker-choosable for custom tokens.
        - name: type
          in: query
          schema: { type: string, enum: [transfer, mint, burn, clawback] }
        - name: startLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: endLedger
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of movements with scan status and coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      tags: [operational]
      summary: Process liveness
      responses:
        "200": { description: The process is up. }
  /ready:
    get:
      tags: [operational]
      summary: Ingestion readiness
      responses:
        "200": { description: Ingestion is at the tip. }
        "503": { description: Catching up or backfilling; do not route reads that need freshness. }
  /status:
    get:
      tags: [operational]
      summary: Human-readable instance status
      responses:
        "200":
          description: Instance status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /metrics:
    get:
      tags: [operational]
      summary: Prometheus metrics (documented in docs/METRICS.md)
      responses:
        "200": { description: Prometheus exposition format. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The ADMIN_TOKEN boot configuration value.
    basicAuth:
      type: http
      scheme: basic
      description: >
        Only when the instance sets HTTP_BASIC_AUTH: then EVERY path in
        this document except /health and /ready additionally requires
        these credentials. Instances on private networking leave it unset
        and reads stay open.

  parameters:
    contractID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: C... strkey contract address.

  responses:
    BadRequest:
      description: Invalid input; the error message says exactly what to fix.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The contract is not registered on this instance.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Contract:
      type: object
      properties:
        contract_id: { type: string }
        network: { type: string, enum: [testnet, mainnet] }
        source: { type: string, enum: [api, config] }
        kinds:
          type: array
          items: { type: string }
        classification:
          $ref: "#/components/schemas/Classification"
        registered_at: { type: string, format: date-time }

    Classification:
      type: object
      nullable: true
      description: What registration learned from the chain. Advisory.
      properties:
        type: { type: string, enum: [wasm, sac, external] }
        wasm_hash: { type: string, description: Hex code hash (wasm only). }
        events:
          type: array
          items: { type: string }
          description: Discovered event names, snake_case.
        method:
          type: string
          enum: [spec_events, function_names, sac_builtin, opaque]
          description: How the events were discovered.

    ContractSummary:
      type: object
      properties:
        contract_id: { type: string }
        network: { type: string }
        source: { type: string, enum: [api, config] }
        kinds:
          type: array
          items: { type: string, enum: [events, state, transfers, trustlines, movements] }
        classification: { type: object }
        registered_at: { type: string, format: date-time }

    ContractList:
      type: object
      properties:
        contracts:
          type: array
          items: { $ref: "#/components/schemas/ContractSummary" }

    ContractDetail:
      allOf:
        - $ref: "#/components/schemas/Contract"
        - type: object
          properties:
            coverage:
              type: array
              description: One declaration per registered kind.
              items: { $ref: "#/components/schemas/Coverage" }
            events:
              type: object
              properties:
                total: { type: integer, format: int64 }
                by_name:
                  type: object
                  additionalProperties: { type: integer, format: int64 }

    Coverage:
      type: object
      description: >
        The range this instance can vouch for, FOR ONE KIND (rule 7).
        Coverage is a property of (contract, kind): a walk derives only the
        kinds the registration carried while it ran, so a kind added later
        is not covered below the anchor until the walk is reopened.
      properties:
        kind:
          type: string
          enum: [events, state, transfers, trustlines, movements]
          description: The data kind this declaration is about.
        kindDerived:
          type: boolean
          description: >
            False when the registration does not derive this kind at all —
            an empty page then means "not indexed", never "nothing
            happened", and indexedFrom/To are 0.
        requestedFromLedger: { type: integer }
        requestedToLedger:
          type: integer
          nullable: true
          description: null means the query follows the tip.
        indexedFromLedger:
          type: integer
          description: >
            Oldest ledger vouched for. Right after a registration this can
            be GREATER than indexedToLedger: the backfill is anchored a
            little past the live cursor so the ledgers closing while the
            ingesting process reloads its registry are walked by somebody.
            An inverted pair is not an error, it is an EMPTY window — the
            instance vouches for nothing yet — and it closes on its own
            within a reload interval. Do not compute a span from these two
            numbers without checking the order first.
        indexedToLedger: { type: integer }
        backfillPending:
          type: boolean
          description: The lower bound is still improving.
        clampedAt:
          type: integer
          nullable: true
          description: >
            History below this ledger is unreachable from current sources
            (persisted as a gap; the archive leg can heal it).

    Event:
      type: object
      properties:
        id:
          type: string
          description: "{toid}-{event_index}, zero-padded, sortable."
        type: { type: string, enum: [contract] }
        ledger: { type: integer }
        ledgerClosedAt: { type: string, format: date-time }
        contractId: { type: string }
        topic:
          type: array
          items: { type: string }
          description: Base64 ScVal topics.
        value: { type: string, description: Base64 ScVal event data. }
        inSuccessfulContractCall:
          type: boolean
          description: Always true — failed transactions are never indexed.
        txHash: { type: string }
        txIndex: { type: integer }
        opIndex: { type: integer }
        eventName:
          type: string
          description: topic0 symbol when decodable. Sierpe extension.

    EventsPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        cursor:
          type: string
          description: Opaque cursor for the next page. Always returned.
        scanStatus:
          type: string
          enum: [HAS_MORE, WAITING_FOR_LEDGERS, OLDEST_REACHED, COMPLETE]
          description: |
            HAS_MORE: more matching rows exist now — follow the cursor.
            WAITING_FOR_LEDGERS: the indexed range ended before the
            requested bound; more may appear as the tip advances.
            OLDEST_REACHED: the request reaches below what this instance
            can vouch for (see coverage).
            COMPLETE: the requested bounds are fully indexed and exhausted.
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    StateEntry:
      type: object
      properties:
        key: { type: string, description: Base64 ScVal entry key. }
        durability: { type: string, enum: [temporary, persistent] }
        value: { type: string, description: Base64 ScVal entry value. }
        lastModifiedLedger: { type: integer }
        closedAt: { type: string, format: date-time }

    StateSnapshotPage:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/StateEntry" }
        cursor:
          type: string
          description: Present only when more entries exist.
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    StateChange:
      type: object
      properties:
        id: { type: string, description: "{toid}-{change_index}, sortable." }
        ledger: { type: integer }
        ledgerClosedAt: { type: string, format: date-time }
        contractId: { type: string }
        key: { type: string, description: Base64 ScVal entry key. }
        durability: { type: string, enum: [temporary, persistent] }
        changeType: { type: string, enum: [created, updated, removed, restored] }
        pre: { type: string, description: Base64 ScVal value before (absent on create). }
        post: { type: string, description: Base64 ScVal value after (absent on remove). }
        txHash: { type: string }
        txIndex: { type: integer }
        opIndex: { type: integer }

    StateHistoryPage:
      type: object
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/StateChange" }
        cursor: { type: string }
        scanStatus:
          type: string
          enum: [HAS_MORE, WAITING_FOR_LEDGERS, OLDEST_REACHED, COMPLETE]
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    Transfer:
      type: object
      properties:
        id: { type: string, description: "{toid}-{event_index}, identical to the source event id." }
        ledger: { type: integer }
        ledgerClosedAt: { type: string, format: date-time }
        contractId: { type: string }
        transferType: { type: string, enum: [transfer, mint, burn, clawback] }
        from: { type: string, description: Sender address (absent on mint). }
        to: { type: string, description: Recipient address (absent on burn and clawback). }
        toMuxedId:
          type: string
          description: >
            CAP-67 destination muxed id when the event carried one: u64 as
            decimal, bytes as hex, string verbatim.
        amount: { type: string, description: Exact i128 amount in raw token units. }
        asset: { type: string, description: SEP-0011 asset string (absent for custom tokens that omit it). }
        txHash: { type: string }
        txIndex: { type: integer }
        opIndex: { type: integer }

    TransfersPage:
      type: object
      properties:
        transfers:
          type: array
          items: { $ref: "#/components/schemas/Transfer" }
        cursor: { type: string }
        scanStatus:
          type: string
          enum: [HAS_MORE, WAITING_FOR_LEDGERS, OLDEST_REACHED, COMPLETE]
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    TrustlineEntry:
      type: object
      properties:
        accountId: { type: string, description: Trustline holder (G... strkey). }
        asset: { type: string, description: SEP-0011 canonical CODE:ISSUER. }
        balance: { type: string, description: int64 stroop-scale balance. }
        limit: { type: string, description: int64 stroop-scale trust limit. }
        flags: { type: integer, description: Trustline authorization flags. }
        lastModifiedLedger: { type: integer }
        closedAt: { type: string, format: date-time }

    TrustlineSnapshotPage:
      type: object
      properties:
        trustlines:
          type: array
          items: { $ref: "#/components/schemas/TrustlineEntry" }
        cursor:
          type: string
          description: Present only when more trustlines exist.
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    TrustlineChange:
      type: object
      properties:
        id: { type: string, description: "{toid}-{change_index}, sortable." }
        ledger: { type: integer }
        ledgerClosedAt: { type: string, format: date-time }
        contractId: { type: string }
        accountId: { type: string }
        asset: { type: string }
        changeType: { type: string, enum: [created, updated, removed, restored] }
        preBalance: { type: string, description: Balance before (absent on create). }
        postBalance: { type: string, description: Balance after (absent on remove). }
        preLimit: { type: string }
        postLimit: { type: string }
        flags: { type: integer }
        txHash: { type: string }
        txIndex: { type: integer }
        opIndex: { type: integer }

    TrustlineHistoryPage:
      type: object
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/TrustlineChange" }
        cursor: { type: string }
        scanStatus:
          type: string
          enum: [HAS_MORE, WAITING_FOR_LEDGERS, OLDEST_REACHED, COMPLETE]
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }

    Movement:
      type: object
      properties:
        id:
          type: string
          description: >
            The source transfer's id, which is also its event id. A
            self-transfer produces two rows sharing it, so key on (id, role).
        role: { type: string, enum: [recipient, sender] }
        tokenContractId:
          type: string
          description: The emitting token contract — the asset's identity.
        transferType: { type: string, enum: [transfer, mint, burn, clawback] }
        counterparty:
          type: string
          description: The other side; absent on mint (in) and burn (out).
        amount: { type: string, description: Exact i128 amount in raw token units. }
        ledger: { type: integer }
        ledgerClosedAt: { type: string, format: date-time }

    MovementsPage:
      type: object
      properties:
        movements:
          type: array
          items: { $ref: "#/components/schemas/Movement" }
        cursor: { type: string }
        scanStatus:
          type: string
          enum: [HAS_MORE, WAITING_FOR_LEDGERS, OLDEST_REACHED, COMPLETE]
        coverage: { $ref: "#/components/schemas/Coverage" }
        latestLedger: { type: integer }
        note:
          type: string
          description: States what this resource is not — read it before treating totals as balances.

    Status:
      type: object
      properties:
        version: { type: string }
        network: { type: string }
        started_at: { type: string, format: date-time }
        ready: { type: boolean }
        cursor_sequence: { type: integer }
        latest_known_ledger: { type: integer }
        tip_lag_seconds: { type: number }
        open_gaps: { type: integer }
        source_failovers: { type: integer }
        pending_backfills: { type: integer }
        archive:
          type: string
          enum: [off, unverified, verified, equivalence_failed]
          description: >
            Archive leg state: off (no stellar-core configured), unverified
            (configured, gate not yet run), verified (heals allowed), or
            equivalence_failed (healing disabled; gaps stay recorded).
